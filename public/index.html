<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UEK Designer Admin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --accent: #4f7cff;
      --accent2: #7c4fff;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #e8eaf0;
      --text2: #8890a8;
      --radius: 12px;
      --font: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* LOGIN */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card p {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .btn-google {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #1f1f1f;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.15s;
    }

    .btn-google:hover {
      opacity: 0.9;
    }

    /* MAIN APP */
    #app {
      display: none;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--text2);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* APP SELECTOR */
    .app-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .app-chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .app-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.yellow {
      color: var(--yellow);
    }

    .stat-value.red {
      color: var(--red);
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .search-box::placeholder {
      color: var(--text2);
    }

    .btn {
      padding: 10px 16px;
      border-radius: var(--radius);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: var(--red);
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* USER LIST */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .user-card:hover {
      border-color: var(--accent);
    }

    .user-card.selected {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-email {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    .user-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-trial {
      background: rgba(245, 158, 11, 0.15);
      color: var(--yellow);
    }

    .badge-active {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }

    .badge-locked {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
    }

    .badge-unknown {
      background: var(--surface2);
      color: var(--text2);
    }

    /* ACTION PANEL */
    #action-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
    }

    .action-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .action-email {
      color: var(--accent);
      font-weight: 400;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .select-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .select-input:focus {
      border-color: var(--accent);
    }

    .num-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      width: 100px;
    }

    .num-input:focus {
      border-color: var(--accent);
    }

    /* KEY GENERATOR */
    .key-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
    }

    .key-section h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .key-result {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-align: center;
      margin-top: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .key-result:hover {
      border-color: var(--accent);
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      z-index: 100;
      transition: transform 0.25s;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    #toast.success {
      border-color: var(--green);
      color: var(--green);
    }

    #toast.error {
      border-color: var(--red);
      color: var(--red);
    }

    /* LOADING */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text2);
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .stats-row {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .stat-value {
        font-size: 20px;
      }

      .login-card {
        padding: 32px 24px;
      }

      header {
        padding: 0 16px;
      }

      .admin-badge {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">UEK</div>
      <h1>UEK Designer Admin</h1>
      <p>Lisans yönetim paneli</p>
      <button class="btn-google" onclick="signIn()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.859-3.048.859-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
          <path fill="#FBBC05"
            d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" />
          <path fill="#EA4335"
            d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" />
        </svg>
        Google ile Giriş Yap
      </button>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header>
      <div class="header-left">
        <div class="header-logo">UEK</div>
        <span class="header-title">UEK Designer Admin</span>
      </div>
      <div class="header-right">
        <span class="admin-badge" id="admin-email-badge"></span>
        <button class="btn-logout" onclick="signOut()">Çıkış</button>
      </div>
    </header>

    <main>
      <!-- APP CHIPS -->
      <div class="app-bar" id="app-bar">
        <div class="app-chip active" onclick="selectApp('windesign_craft', this)">WinDesign Craft Pro</div>
      </div>

      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Toplam</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Aktif</div>
          <div class="stat-value green" id="stat-active">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Deneme</div>
          <div class="stat-value yellow" id="stat-trial">—</div>
        </div>
      </div>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <input class="search-box" type="text" placeholder="E-posta ara..." id="search-input" oninput="filterUsers()" />
        <button class="btn btn-ghost" onclick="loadUsers()">↻ Yenile</button>
      </div>

      <!-- USER LIST -->
      <div class="user-list" id="user-list">
        <div class="spinner"></div>
      </div>

      <!-- ACTION PANEL -->
      <div id="action-panel">
        <div class="action-title">
          Lisans Yönet — <span class="action-email" id="action-email"></span>
        </div>
        <div class="action-row">
          <select class="select-input" id="tier-select">
            <option value="monthly">Aylık</option>
            <option value="yearly">Yıllık</option>
          </select>
          <input class="num-input" type="number" id="duration-input" value="30" min="1" max="3650" title="Gün sayısı" />
          <span style="color:var(--text2);font-size:13px;align-self:center;">gün</span>
          <button class="btn btn-primary" onclick="assignLicense()">Lisans Ata</button>
          <button class="btn btn-danger" onclick="revokeLicense()">İptal Et</button>
        </div>
      </div>

      <!-- KEY GENERATOR -->
      <div class="key-section">
        <h3>Lisans Anahtarı Üret</h3>
        <div class="action-row">
          <select class="select-input" id="key-tier-select">
            <option value="monthly">Aylık (30 gün)</option>
            <option value="yearly">Yıllık (365 gün)</option>
          </select>
          <button class="btn btn-primary" onclick="generateKey()">Anahtar Üret</button>
        </div>
        <div class="key-result" id="key-result" style="display:none" onclick="copyKey()">
          —
        </div>
      </div>
    </main>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      getFunctions, httpsCallable
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-functions.js';

    const firebaseConfig = {
      apiKey: "AIzaSyA73w5mZkDU2goAf7pbdqzZtO5S4JXEZfM",
      authDomain: "windesign-craft-pro.firebaseapp.com",
      projectId: "windesign-craft-pro",
      storageBucket: "windesign-craft-pro.appspot.com",
      messagingSenderId: "744072834944",
      appId: "1:744072834944:android:ac0ae4631e82dbd3b19b65"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app, 'us-central1');

    // Admin e-postaları
    const ADMIN_EMAILS = ['muratalper81@gmail.com'];

    let currentUser = null;
    let allUsers = [];
    let selectedUid = null;
    let currentAppId = 'windesign_craft';

    // Auth durumu
    onAuthStateChanged(auth, (user) => {
      if (user && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('admin-email-badge').textContent = user.email;
        loadUsers();
      } else if (user) {
        fbSignOut(auth);
        showToast('Bu hesap admin değil.', 'error');
      } else {
        currentUser = null;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
      }
    });

    window.signIn = async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        showToast('Giriş başarısız.', 'error');
      }
    };

    window.signOut = () => fbSignOut(auth);

    window.selectApp = (appId, el) => {
      currentAppId = appId;
      document.querySelectorAll('.app-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedUid = null;
      document.getElementById('action-panel').style.display = 'none';
      loadUsers();
    };

    window.loadUsers = async () => {
      document.getElementById('user-list').innerHTML = '<div class="spinner"></div>';
      document.getElementById('action-panel').style.display = 'none';
      selectedUid = null;

      try {
        const fn = httpsCallable(functions, 'adminGetUsers');
        const result = await fn({ appId: currentAppId });
        allUsers = result.data.users || [];
        renderUsers(allUsers);
        updateStats(allUsers);
      } catch (e) {
        document.getElementById('user-list').innerHTML =
          `<div class="empty-state"><div class="icon">⚠️</div><div>${e.message}</div></div>`;
      }
    };

    function updateStats(users) {
      document.getElementById('stat-total').textContent = users.length;
      document.getElementById('stat-active').textContent = users.filter(u => u.status === 'active').length;
      document.getElementById('stat-trial').textContent = users.filter(u => u.status === 'trial').length;
    }

    function renderUsers(users) {
      const list = document.getElementById('user-list');
      if (users.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">👥</div><div>Henüz kullanıcı yok</div></div>';
        return;
      }

      list.innerHTML = users.map(u => {
        const badge = badgeFor(u.status);
        const meta = metaFor(u);
        const initials = (u.email || '?')[0].toUpperCase();
        return `
        <div class="user-card" id="card-${u.uid}" onclick="selectUser('${u.uid}')">
          <div class="user-avatar">${initials}</div>
          <div class="user-info">
            <div class="user-email">${u.email || u.uid}</div>
            <div class="user-meta">${meta}</div>
          </div>
          <div class="user-right">
            <span class="badge badge-${u.status}">${badge}</span>
            <span style="font-size:11px;color:var(--text2)">${u.projectCount} proje</span>
          </div>
        </div>`;
      }).join('');
    }

    function badgeFor(status) {
      return { trial: 'Deneme', active: 'Aktif', locked: 'Kilitli', expired: 'Süresi Doldu' }[status] || status;
    }

    function metaFor(u) {
      if (u.status === 'active' && u.licenseExpiresAt) {
        const d = new Date(u.licenseExpiresAt);
        return `Lisans: ${d.toLocaleDateString('tr-TR')} — ${u.tier}`;
      }
      if (u.trialEndsAt) {
        const d = new Date(u.trialEndsAt);
        const left = Math.ceil((u.trialEndsAt - Date.now()) / 86400000);
        return left > 0 ? `Deneme bitiş: ${d.toLocaleDateString('tr-TR')} (${left} gün kaldı)` : 'Deneme süresi doldu';
      }
      return '—';
    }

    window.filterUsers = () => {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allUsers.filter(u => (u.email || '').toLowerCase().includes(q));
      renderUsers(filtered);
    };

    window.selectUser = (uid) => {
      selectedUid = uid;
      document.querySelectorAll('.user-card').forEach(c => c.classList.remove('selected'));
      const card = document.getElementById(`card-${uid}`);
      if (card) card.classList.add('selected');

      const user = allUsers.find(u => u.uid === uid);
      document.getElementById('action-email').textContent = user?.email || uid;

      // Tier'a göre varsayılan seç
      const tierSel = document.getElementById('tier-select');
      const durInput = document.getElementById('duration-input');
      if (user?.tier === 'yearly') { tierSel.value = 'yearly'; durInput.value = 365; }
      else { tierSel.value = 'monthly'; durInput.value = 30; }

      document.getElementById('action-panel').style.display = 'block';
      document.getElementById('action-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    // Tier değişince gün güncelle
    document.getElementById('tier-select').addEventListener('change', (e) => {
      document.getElementById('duration-input').value = e.target.value === 'yearly' ? 365 : 30;
    });

    window.assignLicense = async () => {
      if (!selectedUid) return;
      const tier = document.getElementById('tier-select').value;
      const days = parseInt(document.getElementById('duration-input').value);
      try {
        const fn = httpsCallable(functions, 'adminSetLicense');
        await fn({ appId: currentAppId, uid: selectedUid, tier, durationDays: days });
        showToast('Lisans atandı ✓', 'success');
        await loadUsers();
      } catch (e) {
        showToast(e.message, 'error');
      }
    };

    window.revokeLicense = async () => {
      if (!selectedUid) return;
      if (!confirm('Bu kullanıcının lisansını iptal etmek istediğinden emin misin?')) return;
      try {
        const fn = httpsCallable(functions, 'adminSetLicense');
        await fn({ appId: currentAppId, uid: selectedUid, action: 'revoke' });
        showToast('Lisans iptal edildi', 'success');
        await loadUsers();
      } catch (e) {
        showToast(e.message, 'error');
      }
    };

    window.generateKey = async () => {
      const tier = document.getElementById('key-tier-select').value;
      try {
        const fn = httpsCallable(functions, 'generateLicenseKey');
        const result = await fn({ appId: currentAppId, tier });
        const key = result.data.key;
        const el = document.getElementById('key-result');
        el.textContent = key;
        el.style.display = 'block';
        window._lastKey = key;
        showToast('Anahtar üretildi — kopyalamak için tıkla', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    };

    window.copyKey = () => {
      const key = document.getElementById('key-result').textContent;
      navigator.clipboard.writeText(key).then(() => showToast('Kopyalandı ✓', 'success'));
    };

    // Toast
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show ${type}`;
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.className = ''; }, 3000);
    }
    window.showToast = showToast;
  </script>
</body>

</html>
